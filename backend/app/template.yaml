AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Resume Analyzer - serverless backend

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:

  # ---------- Storage: uploaded resumes ----------
  ResumesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ai-resume-analyzer-resumes-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteResumesAfter30Days
            Status: Enabled
            ExpirationInDays: 30

  # ---------- Storage: analysis results ----------
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resumeId
          AttributeType: S
      KeySchema:
        - AttributeName: resumeId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------- API: generate presigned upload URL ----------
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_upload_url/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref ResumesBucket
          TABLE_NAME: !Ref ResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ResumesBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ResultsTable.Arn
      Events:
        UploadUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: post

Outputs:
  UploadUrlEndpoint:
    Description: POST here to get a presigned upload URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-url"
  ApiBaseUrl:
    Description: Base URL of the API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ResumesBucketName:
    Description: S3 bucket for uploaded resumes
    Value: !Ref ResumesBucket
  ResultsTableName:
    Description: DynamoDB table for analysis results
    Value: !Ref ResultsTable