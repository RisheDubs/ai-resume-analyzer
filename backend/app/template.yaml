AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Resume Analyzer - serverless backend

Parameters:
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Bedrock model or inference profile ID used for analysis

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:

  # ---------- Storage: uploaded resumes ----------
  ResumesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ai-resume-analyzer-resumes-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteResumesAfter30Days
            Status: Enabled
            ExpirationInDays: 30

  # ---------- Storage: analysis results ----------
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resumeId
          AttributeType: S
      KeySchema:
        - AttributeName: resumeId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------- API: generate presigned upload URL ----------
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_upload_url/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref ResumesBucket
          TABLE_NAME: !Ref ResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ResumesBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ResultsTable.Arn
      Events:
        UploadUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: post

  # ---------- Processing: extract text and analyze with Bedrock ----------
  ProcessResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: process_resume/
      Handler: app.lambda_handler
      Timeout: 180
      MemorySize: 256
      Environment:
        Variables:
          MODEL_ID: !Ref BedrockModelId
          TABLE_NAME: !Ref ResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              # Built as a string (not !Ref ResumesBucket) to avoid a circular dependency
              Resource: !Sub "arn:aws:s3:::ai-resume-analyzer-resumes-${AWS::AccountId}-${AWS::Region}/uploads/*"
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt ResultsTable.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/*"
      Events:
        ResumeUploaded:
          Type: S3
          Properties:
            Bucket: !Ref ResumesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  # ---------- API: fetch status and analysis ----------
  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_result/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ResultsTable.Arn
      Events:
        GetResult:
          Type: Api
          Properties:
            Path: /results/{resumeId}
            Method: get

  # ---------- Hosting: dashboard (private S3 + CloudFront HTTPS) ----------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ai-resume-analyzer-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebsiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AI Resume Analyzer dashboard
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: WebsiteOrigin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed "CachingOptimized"

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

Outputs:
  UploadUrlEndpoint:
    Description: POST here to get a presigned upload URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-url"
  ApiBaseUrl:
    Description: Base URL of the API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ResumesBucketName:
    Description: S3 bucket for uploaded resumes
    Value: !Ref ResumesBucket
  ResultsTableName:
    Description: DynamoDB table for analysis results
    Value: !Ref ResultsTable
  ResultsEndpoint:
    Description: GET status and analysis for a resume
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/results/{resumeId}"
  WebsiteUrl:
    Description: Public HTTPS URL of the dashboard
    Value: !Sub "https://${WebsiteDistribution.DomainName}"
  WebsiteBucketName:
    Description: S3 bucket holding the dashboard files
    Value: !Ref WebsiteBucket
  DistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref WebsiteDistribution